<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MapLibre Contour Form Lines</title>
    <link
      href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="./dist/index.min.js"></script>
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs";
      import Terrain3dToggle from "https://cdn.jsdelivr.net/gh/tjmsy/maplibre-gl-terrain-3d-toggle/src/maplibre-gl-terrain-3d-toggle.js";

      const demSource = new mlcontour.DemSource({
        url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
        encoding: "terrarium",
        maxzoom: 15,
      });
      demSource.setupMaplibre(maplibregl);

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: [86.92731, 27.97797],
        zoom: 15,
        hash: true,
        maxPitch: 0,
      });
      map.addControl(new maplibregl.NavigationControl());

      map.on("load", () => {
        map.addSource("contours", {
          type: "vector",
          tiles: [
            demSource.contourProtocolUrl({
              thresholds: {
                11: [100, 500],
                12: [50, 200],
                13: [10, 50],
                14: [5, 25],
              },
              formlines: true,
            }),
          ],
          maxzoom: 15,
          minzoom: 11,
          attribution:
            "<a href='https://mapterhorn.com/attribution' target='_blank'>© Mapterhorn</a>",
        });

        map.addSource("terrainSource", {
          type: "raster-dem",
          encoding: "terrarium",
          tiles: [demSource.sharedDemProtocolUrl],
          tileSize: 512,
          maxzoom: 15,
        });

        map.addLayer({
          id: "contour-lines",
          type: "line",
          source: "contours",
          "source-layer": "contours",
          paint: {
            "line-color": "#BE7A54",
            "line-width": ["match", ["get", "level"], 1, 1.7, 1],
          },
        });

        map.addLayer({
          id: "form-lines",
          type: "line",
          source: "contours",
          "source-layer": "formlines",
          layout: {
            "line-cap": "butt",
          },
          paint: {
            "line-color": "#BE7A54",
            "line-width": 0.7,
            "line-dasharray": [10, 2],
          },
        });

        map.addLayer({
          id: "hillshade",
          type: "hillshade",
          source: "terrainSource",
          layout: { visibility: "none" },
        });

        map.addControl(
          new maplibregl.TerrainControl({
            source: "terrainSource",
            exaggeration: 1,
          }),
        );

        map.on("terrain", () => {
          const terrainEnabled = map.getTerrain() !== null;
          map.setPitch(terrainEnabled ? 60 : 0);
          map.setMaxPitch(terrainEnabled ? 80 : 0);
          map.setLayoutProperty(
            "hillshade",
            "visibility",
            terrainEnabled ? "visible" : "none",
          );
        });
      });
    </script>
  </body>
</html>
