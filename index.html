<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MapLibre Contour Form Lines</title>
    <link
      href="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@5.16.0/dist/maplibre-gl.js"></script>
    <script src="./dist/index.min.js"></script>
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const demSource = new mlcontour.DemSource({
        url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
        encoding: "terrarium",
        maxzoom: 12,
        cacheSize: 100,
      });
      demSource.setupMaplibre(maplibregl);

      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: [86.92731, 27.97797],
        zoom: 12.3,
        hash: true,
        attributionControl: {
          compact: true,
          customAttribution:
            '<a href="https://mapterhorn.com/attribution/">© Mapterhorn</a>',
        },
      });
      map.addControl(new maplibregl.NavigationControl());

      map.on("load", () => {
        map.addSource("contours", {
          type: "vector",
          tiles: [
            demSource.contourProtocolUrl({
              thresholds: {
                11: [100, 500],
                12: [50, 200],
                13: [20, 100],
                14: [10, 50],
              },
              overzoom: 1,
              formlines: true,
            }),
          ],
          maxzoom: 14,
        });

        map.addLayer({
          id: "form-lines",
          type: "line",
          source: "contours",
          "source-layer": "formlines",
          layout: {
            // Butt caps preserve the narrow gap between dashes.
            "line-cap": "butt",
          },
          paint: {
            "line-color": "#BE7A54",
            "line-width": 0.7,
            // Dash array values are multiples of line width: 10x on, 2x off.
            "line-dasharray": [10, 2],
          },
        });
        map.addLayer({
          id: "contour-lines",
          type: "line",
          source: "contours",
          "source-layer": "contours",
          paint: {
            "line-color": "#BE7A54",
            // level=1 marks every fifth contour (index contour).
            "line-width": ["match", ["get", "level"], 1, 1.7, 1],
          },
        });
        map.addLayer({
          id: "contour-labels",
          type: "symbol",
          source: "contours",
          "source-layer": "contours",
          filter: [">", ["get", "level"], 0],
          layout: {
            "symbol-placement": "line",
            "text-size": 10,
            "text-field": ["concat", ["get", "ele"], " m"],
            "text-font": ["Noto Sans Regular"],
          },
          paint: {
            "text-color": "#5d493d",
            "text-halo-color": "#fffdf6",
            "text-halo-width": 1.2,
          },
        });
      });
    </script>
  </body>
</html>
